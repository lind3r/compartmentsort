/*
 * Dependencies of Compartment Sorting. Versions match GTNH 2.9.0.
 *
 * Binnie comes from the GTNH maven (dev jar). Bogosorter and ModularUI2 aren't published there, so the jars from the
 * GTNH 2.9.0 mods folder are used for compiling only (copy them into libs/; libs/ is git-ignored). Only mod classes
 * are referenced from them, so the obfuscated Minecraft member names inside don't matter.
 */
dependencies {
    compileOnly("com.github.GTNewHorizons:Binnie:2.6.51:dev") { transitive = false }
    compileOnly("com.github.GTNewHorizons:ForestryMC:4.11.40:dev") { transitive = false } // Binnie API types
    compileOnly(files("libs/bogosorter-1.3.55-GTNH.jar", "libs/modularui2-2.3.94-1.7.10.jar"))
}
